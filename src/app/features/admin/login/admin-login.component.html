<div class="admin-login-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/brand/logo-full.png" alt="Africa Univ Technology Sarl" class="brand-logo auth-logo" />
      <h1>Portail Admin AUTS</h1>
      <p>Console Opérationnelle — Centrale Matériel &amp; Infrastructure</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Email administrateur</label>
        <input id="email" class="input" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" class="input" type="password" formControlName="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
        {{ submitting() ? 'Connexion...' : 'Accéder à la console' }}
      </button>
    </form>
  </div>
</div>
