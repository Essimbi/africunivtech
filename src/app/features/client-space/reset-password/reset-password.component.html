<div class="container auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/brand/logo-full.png" alt="Africa Univ Technology Sarl" class="brand-logo auth-logo" />
      <h1>Réinitialiser le mot de passe</h1>
      <p>Choisissez un nouveau mot de passe pour votre compte.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="newPassword">Nouveau mot de passe</label>
        <input id="newPassword" class="input" type="password" formControlName="newPassword" />
        <span class="hint">Minimum 8 caractères.</span>
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting() || !token()">
        {{ submitting() ? 'Mise à jour...' : 'Réinitialiser le mot de passe' }}
      </button>
    </form>

    <p class="auth-footer">
      <a routerLink="/compte/connexion">Retour à la connexion</a>
    </p>
  </div>
</div>
